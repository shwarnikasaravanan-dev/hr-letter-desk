<!doctype html>
<html class="staticrypt-html" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Letter Desk · LAK Technology</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Royal sign-in: midnight plum ground, LAK orange glow, gold hairlines; one centred crest card */
:root{
  --ground:#0f0b16; --plum:#2a1630; --glow:#e4690b;
  --card:rgba(24,18,30,.78); --card-line:rgba(226,186,120,.28);
  --gold:#e2ba78; --gold-2:#b88a45; --ink:#f6efe6; --muted:#b8aa9c; --field:#1b1521; --field-line:#3a2f3e;
  --danger:#ff9a8a;
  --f-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 50% -10%,rgba(228,105,11,.30),transparent 65%),
    radial-gradient(700px 600px at 100% 100%,rgba(122,52,120,.35),transparent 60%),
    radial-gradient(600px 500px at 0% 90%,rgba(226,186,120,.10),transparent 60%),
    linear-gradient(160deg,#170f1d,var(--ground) 55%,#0b0810);
  background-attachment:fixed}
/* fine gold lattice, very faint */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(45deg,var(--gold) 1px,transparent 1px),linear-gradient(-45deg,var(--gold) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%)}
.hidden{display:none!important}

.staticrypt-spinner-container{min-height:100%;display:grid;place-items:center}
.staticrypt-spinner{width:46px;height:46px;border-radius:50%;border:2px solid rgba(226,186,120,.18);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.staticrypt-content{min-height:100%;display:grid;place-items:center;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{position:relative;width:100%;max-width:430px;padding:40px 36px 30px;border-radius:24px;text-align:center;
  background:var(--card);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.4);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
/* gold gradient hairline border */
.card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(242,212,160,.75),rgba(226,186,120,.15) 40%,rgba(228,105,11,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:420px){.card{padding:32px 22px 24px;border-radius:20px}}

.crest{width:118px;height:118px;margin:-4px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 35%,#2b2030,#140f19 70%);
  box-shadow:0 0 0 1px rgba(226,186,120,.55),0 0 0 6px rgba(226,186,120,.07),0 0 0 7px rgba(226,186,120,.28),0 18px 40px -12px rgba(228,105,11,.55)}
.crest img{height:78px;width:auto;max-width:86px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(226,186,120,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.eyebrow{margin:0 0 8px;font:700 10.5px/1.4 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:600 40px/1.05 var(--f-display);letter-spacing:.005em;text-wrap:balance;
  background:linear-gradient(180deg,#fff7ec,#f0d6ad 70%,#d9b073);-webkit-background-clip:text;background-clip:text;color:transparent}
.ornament{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px auto 16px;color:var(--gold);max-width:240px}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(226,186,120,.7),transparent)}
.ornament span{font-size:10px;transform:rotate(45deg);display:inline-block;width:7px;height:7px;background:var(--gold);box-shadow:0 0 12px rgba(226,186,120,.7)}
.lead{margin:0 auto 26px;max-width:300px;font-size:13.5px;line-height:1.6;color:var(--muted)}

form{display:flex;flex-direction:column;gap:14px;text-align:left}
.field{position:relative}
.field label{display:block;margin:0 0 8px 2px;font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.field .lock{position:absolute;left:15px;bottom:15px;width:18px;height:18px;color:var(--gold);opacity:.85;pointer-events:none}
#staticrypt-password{width:100%;height:52px;padding:0 50px 0 44px;border-radius:14px;border:1px solid var(--field-line);background:var(--field);
  color:var(--ink);font:600 16px var(--f-ui);letter-spacing:.06em;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
#staticrypt-password::placeholder{color:#7d7078;letter-spacing:.02em;font-weight:500}
#staticrypt-password:hover{border-color:#54454f}
#staticrypt-password:focus{border-color:var(--gold);background:#1f1825;box-shadow:0 0 0 4px rgba(226,186,120,.16)}
.toggle{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.toggle:hover{color:var(--gold);background:rgba(226,186,120,.08)}
.toggle svg{width:19px;height:19px}
.error{margin:-4px 2px 0;font-size:12.5px;font-weight:600;color:var(--danger);min-height:0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.staticrypt-remember{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
.staticrypt-remember input{appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;border-radius:5px;border:1px solid #5a4b55;background:var(--field);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.staticrypt-remember input::after{content:"";width:9px;height:5px;border:2px solid #1a1007;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.staticrypt-remember input:checked{background:linear-gradient(180deg,#f2d4a0,var(--gold));border-color:var(--gold)}
.staticrypt-remember input:checked::after{opacity:1}

.staticrypt-decrypt-button{margin-top:6px;height:54px;width:100%;border:0;border-radius:14px;cursor:pointer;
  font:700 14px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#1d0e03;
  background:linear-gradient(180deg,#f6dcaa 0%,#e7b871 45%,#e48a2c 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -2px 0 rgba(120,60,10,.35) inset,0 16px 32px -14px rgba(228,105,11,.85);
  transition:transform .12s,filter .2s,box-shadow .2s}
.staticrypt-decrypt-button:hover{filter:brightness(1.06)}
.staticrypt-decrypt-button:active{transform:translateY(1px)}
.staticrypt-decrypt-button:disabled{filter:saturate(.6) brightness(.9);cursor:progress}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.foot{margin:26px 0 0;font-size:11px;letter-spacing:.06em;color:#8a7d86}
.foot strong{color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
