<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Letter Desk · LAK Technology</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Noir sign-in: black and charcoal under a single smoky spotlight, antique gold, a trace of oxblood; square frame with gold corner brackets */
:root{
  --black:#060606; --coal:#0e0e0e; --panel:#111111; --field:#0a0a0a; --line:#2a2722;
  --gold:#c9a45c; --gold-hi:#e8cf94; --gold-lo:#8a6a32; --ink:#ece6da; --muted:#9c958a; --blood:#7a1414; --danger:#e0675c;
  --f-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(700px 520px at 50% -8%,rgba(201,164,92,.20),transparent 62%),
    radial-gradient(900px 700px at 50% 120%,rgba(122,20,20,.28),transparent 60%),
    radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.85) 100%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
    linear-gradient(180deg,#121110,var(--black) 60%);
  background-attachment:fixed}
.hidden{display:none!important}

.spin-wrap{min-height:100%;display:grid;place-items:center}
.spinner{width:44px;height:44px;border-radius:50%;border:2px solid rgba(201,164,92,.15);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{min-height:100%;display:grid;place-items:center;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{position:relative;width:100%;max-width:440px;padding:46px 40px 30px;text-align:center;border-radius:4px;
  background:linear-gradient(180deg,#151413,var(--panel) 30%,#0c0c0c);
  border:1px solid var(--gold-lo);
  box-shadow:inset 0 0 0 6px var(--panel),inset 0 0 0 7px rgba(201,164,92,.35),0 50px 100px -30px #000,0 0 0 1px #000;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
/* gold corner brackets */
.card .corner{position:absolute;width:26px;height:26px;border-color:var(--gold);border-style:solid;pointer-events:none}
.card .tl{top:-1px;left:-1px;border-width:3px 0 0 3px}
.card .tr{top:-1px;right:-1px;border-width:3px 3px 0 0}
.card .bl{bottom:-1px;left:-1px;border-width:0 0 3px 3px}
.card .br{bottom:-1px;right:-1px;border-width:0 3px 3px 0}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:420px){.card{padding:38px 22px 24px}}

.crest{width:112px;height:112px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#1c1a17,#070707 72%);
  box-shadow:0 0 0 2px var(--gold),0 0 0 5px #070707,0 0 0 6px rgba(201,164,92,.45),0 22px 40px -14px rgba(0,0,0,.9)}
.crest img{height:74px;width:auto;max-width:82px;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(201,164,92,.25))}
.eyebrow{margin:0 0 10px;font:600 10px/1.4 var(--f-ui);letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:800 32px/1.08 var(--f-display);letter-spacing:.08em;text-transform:uppercase;text-wrap:balance;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.9))}
.ornament{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px auto 16px;max-width:260px}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ornament span{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold);background:var(--blood)}
.lead{margin:0 auto 26px;max-width:310px;font-size:12px;line-height:1.7;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

form{display:flex;flex-direction:column;gap:16px;text-align:left}
.field{position:relative}
.field label{display:block;margin:0 0 8px;font:700 10.5px var(--f-ui);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.field .ico{position:absolute;left:14px;bottom:16px;width:18px;height:18px;color:var(--gold);opacity:.8;pointer-events:none}
.field input{width:100%;height:52px;padding:0 50px 0 44px;border-radius:2px;border:1px solid var(--line);border-bottom:1px solid #4a4235;background:var(--field);
  color:var(--ink);font:600 15px var(--f-ui);letter-spacing:.06em;outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:#5f5a52;font-weight:500;letter-spacing:.04em}
.field input:hover{border-color:#3a352d}
.field input:focus{border-color:var(--gold);box-shadow:0 2px 0 0 var(--gold),0 0 24px -6px rgba(201,164,92,.35)}
.toggle{position:absolute;right:6px;bottom:8px;width:36px;height:36px;border:0;border-radius:2px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.toggle:hover{color:var(--gold)}
.toggle svg{width:19px;height:19px}
.error{margin:-6px 0 0;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--danger)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.remember{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none}
.remember input{appearance:none;-webkit-appearance:none;margin:0;width:17px;height:17px;border-radius:1px;border:1px solid #5a503f;background:var(--field);display:grid;place-items:center;cursor:pointer}
.remember input::after{content:"";width:9px;height:5px;border:2px solid #0a0a0a;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.remember input:checked{background:var(--gold);border-color:var(--gold)}
.remember input:checked::after{opacity:1}

.go{margin-top:8px;height:54px;width:100%;cursor:pointer;border-radius:2px;
  font:700 14px var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-hi);
  background:linear-gradient(180deg,#1a1815,#0b0b0b);border:1px solid var(--gold);
  box-shadow:inset 0 0 0 3px #0b0b0b,inset 0 0 0 4px rgba(201,164,92,.35),0 18px 30px -18px #000;
  transition:background .2s,color .2s,box-shadow .2s}
.go:hover{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#0a0a0a;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15),0 0 30px -6px rgba(201,164,92,.55)}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.75;cursor:progress}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.foot{margin:28px 0 0;font:600 10px var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:#6d665b}
.foot strong{color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    const SESSION_KEY = 'lakdesk.session', REMEMBER_KEY = 'lakdesk.remember', DAYS = 30;
    const enc = new TextEncoder(), dec = new TextDecoder(), subtle = crypto.subtle;
    const $ = id => document.getElementById(id);
    const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const b64e = u => { u = new Uint8Array(u); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
    const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    const idHash = (users, id) => subtle.digest('SHA-256', enc.encode(users.idSalt + ':' + id.trim().toLowerCase())).then(hex);
    async function loadUsers(){
      const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('network');
      return r.json();
    }
    async function derive(pw, salt, iter){
      const base = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      return new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, 256));
    }
    async function unseal(entry, bits){
      const k = await subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
      return new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv: b64d(entry.iv) }, k, b64d(entry.wk)));
    }
    async function openApp(siteKey, who){
      const k = await subtle.importKey('raw', siteKey, 'AES-GCM', false, ['decrypt']);
      const html = dec.decode(await subtle.decrypt({ name: 'AES-GCM', iv: b64d(PAYLOAD.iv) }, k, b64d(PAYLOAD.ct)));
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({}, who, { k: b64e(siteKey) })));
      document.open(); document.write(html); document.close();
    }
    /* Re-check a saved sign-in against the current users.json, so removed users and changed passwords take effect */
    async function resume(saved){
      if (!saved || !saved.h || !saved.d) return false;
      try {
        const users = await loadUsers(), entry = users.users[saved.h];
        if (!entry) return false;
        const key = await unseal(entry, b64d(saved.d));
        await openApp(key, { uid: saved.uid, role: entry.role, h: saved.h, d: saved.d });
        return true;
      } catch (e) { return false; }
    }
    function showForm(){ $('loading').classList.add('hidden'); $('content').classList.remove('hidden'); $('uid').focus(); }
    function fail(msg){
      const err = $('err'); err.textContent = msg; err.classList.remove('hidden');
      const w = $('pwWrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
      $('pw').select(); $('pw').focus();
    }

    window.addEventListener('load', async () => {
      let s = null, r = null;
      try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
      try { r = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); } catch (e) {}
      if (s && await resume(s)) return;
      if (r && r.exp > Date.now() && await resume(r)) return;
      sessionStorage.removeItem(SESSION_KEY);
      if (r) localStorage.removeItem(REMEMBER_KEY);
      showForm();
    });

    $('toggle').addEventListener('click', () => {
      const pw = $('pw'), show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      $('eye').innerHTML = show
        ? '<path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4"/><path d="M6.2 6.9C3.9 8.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9.6 9.6 0 0 0 4.4-1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4 4"/>'
        : '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>';
      const label = show ? 'Hide password' : 'Show password';
      $('toggle').setAttribute('aria-label', label); $('toggle').title = label; pw.focus();
    });
    ['uid', 'pw'].forEach(id => $(id).addEventListener('input', () => $('err').classList.add('hidden')));

    $('signin').addEventListener('submit', async e => {
      e.preventDefault();
      const id = $('uid').value.trim(), pw = $('pw').value;
      if (!id || !pw) return fail('Enter your User ID and password.');
      const go = $('go'); go.disabled = true; go.textContent = 'Opening…';
      try {
        const users = await loadUsers(), h = await idHash(users, id), entry = users.users[h];
        let key = null, bits = null;
        if (entry) {
          bits = await derive(pw, b64d(entry.salt), users.iter);
          try { key = await unseal(entry, bits); } catch (err) { key = null; }
        }
        if (!key) { go.disabled = false; go.textContent = 'Enter'; return fail('User ID or password is not correct.'); }
        const who = { uid: id, role: entry.role, h, d: b64e(bits) };
        if ($('remember').checked) localStorage.setItem(REMEMBER_KEY, JSON.stringify(Object.assign({ exp: Date.now() + DAYS * 864e5 }, who)));
        else localStorage.removeItem(REMEMBER_KEY);
        await openApp(key, who);
      } catch (err) {
        go.disabled = false; go.textContent = 'Enter';
        fail(err && err.message === 'network' ? 'Could not reach the website. Check your internet connection and try again.' : 'Something went wrong while opening. Please try again.');
      }
    });
  })();
  </script>
