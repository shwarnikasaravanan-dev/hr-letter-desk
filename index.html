<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Letter Desk · LAK Technology</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Royal sign-in: midnight plum ground, LAK orange glow, gold hairlines; one centred crest card */
:root{
  --ground:#0f0b16; --card:rgba(24,18,30,.78);
  --gold:#e2ba78; --ink:#f6efe6; --muted:#b8aa9c; --field:#1b1521; --field-line:#3a2f3e; --danger:#ff9a8a;
  --f-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 50% -10%,rgba(228,105,11,.30),transparent 65%),
    radial-gradient(700px 600px at 100% 100%,rgba(122,52,120,.35),transparent 60%),
    radial-gradient(600px 500px at 0% 90%,rgba(226,186,120,.10),transparent 60%),
    linear-gradient(160deg,#170f1d,var(--ground) 55%,#0b0810);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(45deg,var(--gold) 1px,transparent 1px),linear-gradient(-45deg,var(--gold) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%)}
.hidden{display:none!important}

.spin-wrap{min-height:100%;display:grid;place-items:center}
.spinner{width:46px;height:46px;border-radius:50%;border:2px solid rgba(226,186,120,.18);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{min-height:100%;display:grid;place-items:center;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{position:relative;width:100%;max-width:430px;padding:40px 36px 30px;border-radius:24px;text-align:center;
  background:var(--card);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.4);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(242,212,160,.75),rgba(226,186,120,.15) 40%,rgba(228,105,11,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:420px){.card{padding:32px 22px 24px;border-radius:20px}}

.crest{width:118px;height:118px;margin:-4px auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#2b2030,#140f19 70%);
  box-shadow:0 0 0 1px rgba(226,186,120,.55),0 0 0 6px rgba(226,186,120,.07),0 0 0 7px rgba(226,186,120,.28),0 18px 40px -12px rgba(228,105,11,.55)}
.crest img{height:78px;width:auto;max-width:86px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(226,186,120,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.eyebrow{margin:0 0 8px;font:700 10.5px/1.4 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:600 40px/1.05 var(--f-display);letter-spacing:.005em;text-wrap:balance;
  background:linear-gradient(180deg,#fff7ec,#f0d6ad 70%,#d9b073);-webkit-background-clip:text;background-clip:text;color:transparent}
.ornament{display:flex;align-items:center;gap:12px;justify-content:center;margin:18px auto 16px;max-width:240px}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(226,186,120,.7),transparent)}
.ornament span{transform:rotate(45deg);display:inline-block;width:7px;height:7px;background:var(--gold);box-shadow:0 0 12px rgba(226,186,120,.7)}
.lead{margin:0 auto 24px;max-width:300px;font-size:13.5px;line-height:1.6;color:var(--muted)}

form{display:flex;flex-direction:column;gap:14px;text-align:left}
.field{position:relative}
.field label{display:block;margin:0 0 8px 2px;font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.field .ico{position:absolute;left:15px;bottom:17px;width:18px;height:18px;color:var(--gold);opacity:.85;pointer-events:none}
.field input{width:100%;height:52px;padding:0 50px 0 44px;border-radius:14px;border:1px solid var(--field-line);background:var(--field);
  color:var(--ink);font:600 16px var(--f-ui);letter-spacing:.03em;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field input::placeholder{color:#7d7078;font-weight:500}
.field input:hover{border-color:#54454f}
.field input:focus{border-color:var(--gold);background:#1f1825;box-shadow:0 0 0 4px rgba(226,186,120,.16)}
.toggle{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.toggle:hover{color:var(--gold);background:rgba(226,186,120,.08)}
.toggle svg{width:19px;height:19px}
.error{margin:-4px 2px 0;font-size:12.5px;font-weight:600;color:var(--danger)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.remember{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
.remember input{appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;border-radius:5px;border:1px solid #5a4b55;background:var(--field);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.remember input::after{content:"";width:9px;height:5px;border:2px solid #1a1007;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.remember input:checked{background:linear-gradient(180deg,#f2d4a0,var(--gold));border-color:var(--gold)}
.remember input:checked::after{opacity:1}

.go{margin-top:6px;height:54px;width:100%;border:0;border-radius:14px;cursor:pointer;
  font:700 14px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#1d0e03;
  background:linear-gradient(180deg,#f6dcaa 0%,#e7b871 45%,#e48a2c 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -2px 0 rgba(120,60,10,.35) inset,0 16px 32px -14px rgba(228,105,11,.85);
  transition:transform .12s,filter .2s}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(1px)}
.go:disabled{filter:saturate(.6) brightness(.9);cursor:progress}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.foot{margin:26px 0 0;font-size:11px;letter-spacing:.06em;color:#8a7d86}
.foot strong{color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    const SESSION_KEY = 'lakdesk.session', REMEMBER_KEY = 'lakdesk.remember', DAYS = 30;
    const enc = new TextEncoder(), dec = new TextDecoder(), subtle = crypto.subtle;
    const $ = id => document.getElementById(id);
    const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const b64e = u => { u = new Uint8Array(u); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
    const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    const idHash = (users, id) => subtle.digest('SHA-256', enc.encode(users.idSalt + ':' + id.trim().toLowerCase())).then(hex);
    async function loadUsers(){
      const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('network');
      return r.json();
    }
    async function derive(pw, salt, iter){
      const base = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      return new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, 256));
    }
    async function unseal(entry, bits){
      const k = await subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
      return new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv: b64d(entry.iv) }, k, b64d(entry.wk)));
    }
    async function openApp(siteKey, who){
      const k = await subtle.importKey('raw', siteKey, 'AES-GCM', false, ['decrypt']);
      const html = dec.decode(await subtle.decrypt({ name: 'AES-GCM', iv: b64d(PAYLOAD.iv) }, k, b64d(PAYLOAD.ct)));
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({}, who, { k: b64e(siteKey) })));
      document.open(); document.write(html); document.close();
    }
    /* Re-check a saved sign-in against the current users.json, so removed users and changed passwords take effect */
    async function resume(saved){
      if (!saved || !saved.h || !saved.d) return false;
      try {
        const users = await loadUsers(), entry = users.users[saved.h];
        if (!entry) return false;
        const key = await unseal(entry, b64d(saved.d));
        await openApp(key, { uid: saved.uid, role: entry.role, h: saved.h, d: saved.d });
        return true;
      } catch (e) { return false; }
    }
    function showForm(){ $('loading').classList.add('hidden'); $('content').classList.remove('hidden'); $('uid').focus(); }
    function fail(msg){
      const err = $('err'); err.textContent = msg; err.classList.remove('hidden');
      const w = $('pwWrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
      $('pw').select(); $('pw').focus();
    }

    window.addEventListener('load', async () => {
      let s = null, r = null;
      try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
      try { r = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); } catch (e) {}
      if (s && await resume(s)) return;
      if (r && r.exp > Date.now() && await resume(r)) return;
      sessionStorage.removeItem(SESSION_KEY);
      if (r) localStorage.removeItem(REMEMBER_KEY);
      showForm();
    });

    $('toggle').addEventListener('click', () => {
      const pw = $('pw'), show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      $('eye').innerHTML = show
        ? '<path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 4"/><path d="M6.2 6.9C3.9 8.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9.6 9.6 0 0 0 4.4-1"/><path d="M9.9 9.9a2.8 2.8 0 0 0 4 4"/>'
        : '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>';
      const label = show ? 'Hide password' : 'Show password';
      $('toggle').setAttribute('aria-label', label); $('toggle').title = label; pw.focus();
    });
    ['uid', 'pw'].forEach(id => $(id).addEventListener('input', () => $('err').classList.add('hidden')));

    $('signin').addEventListener('submit', async e => {
      e.preventDefault();
      const id = $('uid').value.trim(), pw = $('pw').value;
      if (!id || !pw) return fail('Enter your User ID and password.');
      const go = $('go'); go.disabled = true; go.textContent = 'Opening…';
      try {
        const users = await loadUsers(), h = await idHash(users, id), entry = users.users[h];
        let key = null, bits = null;
        if (entry) {
          bits = await derive(pw, b64d(entry.salt), users.iter);
          try { key = await unseal(entry, bits); } catch (err) { key = null; }
        }
        if (!key) { go.disabled = false; go.textContent = 'Enter the Desk'; return fail('User ID or password is not correct.'); }
        const who = { uid: id, role: entry.role, h, d: b64e(bits) };
        if ($('remember').checked) localStorage.setItem(REMEMBER_KEY, JSON.stringify(Object.assign({ exp: Date.now() + DAYS * 864e5 }, who)));
        else localStorage.removeItem(REMEMBER_KEY);
        await openApp(key, who);
      } catch (err) {
        go.disabled = false; go.textContent = 'Enter the Desk';
        fail(err && err.message === 'network' ? 'Could not reach the website. Check your internet connection and try again.' : 'Something went wrong while opening. Please try again.');
      }
    });
  })();
